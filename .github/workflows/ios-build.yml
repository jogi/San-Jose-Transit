name: iOS Build

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
      uses: actions/checkout@v4

      - name: Show Xcode Version
      run: xcodebuild -version

      - name: Build Project
      run: |
        xcodebuild \
          -project "SJ Transit.xcodeproj" \
          -scheme "SJ Transit" \
          -destination 'platform=iOS Simulator,name=iPhone 15' \
          build
